<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Placements">
<meta name="theme-color" content="#0F6E56">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<title>Mes placements</title>
<style>
  :root {
    --bg: #f5f4f0; --card: #ffffff; --text: #1c1c1a; --muted: #6b6a66; --line: #e4e2db;
    --up: #0f7b5a; --down: #c0392b; --accent: #534AB7;
    --c-pea: #534AB7; --c-crypto: #D85A30; --c-av: #1D9E75;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151514; --card: #222221; --text: #f1efe8; --muted: #a09e96; --line: #343432;
      --up: #3ecf9e; --down: #ff7a6b; --accent: #8c84ff;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { padding: env(safe-area-inset-top, 0px) 0 calc(76px + env(safe-area-inset-bottom, 0px)); }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 15px; font-weight: 500; color: var(--muted); margin: 0 0 4px; }
  .total { font-size: 34px; font-weight: 600; letter-spacing: -0.5px; }
  .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin-top: 14px; overflow: hidden; }
  .pad { padding: 14px; }
  .row { display: flex; align-items: center; gap: 10px; padding: 13px 14px; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .row .l { flex: 1; min-width: 0; }
  .row .n { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .d { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .row .r { text-align: right; }
  .row .v { font-weight: 500; }
  .row .g { font-size: 12px; margin-top: 2px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .up { color: var(--up); } .down { color: var(--down); }
  .btn { width: 100%; padding: 13px; border: 0; border-radius: 12px; background: var(--accent); color: #fff;
    font-size: 15px; font-weight: 500; margin-top: 14px; }
  .btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); margin-top: 8px; }
  .btn.danger { background: transparent; color: var(--down); border: 1px solid var(--line); }
  .empty { padding: 22px 14px; text-align: center; color: var(--muted); font-size: 14px; }
  .status { font-size: 12px; color: var(--muted); margin-top: 10px; text-align: center; }
  nav { position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: var(--card);
    border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
  nav button { flex: 1; padding: 12px 4px 10px; border: 0; background: none; color: var(--muted); font-size: 11px; }
  nav button.on { color: var(--accent); font-weight: 600; }
  nav button span { display: block; font-size: 18px; margin-bottom: 2px; }
  dialog { border: 0; border-radius: 16px; padding: 0; width: min(92vw, 420px); background: var(--card); color: var(--text); }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog form { padding: 18px; }
  dialog h2 { margin: 0 0 12px; font-size: 17px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-top: 10px; }
  input, textarea { width: 100%; margin-top: 4px; padding: 11px; font-size: 16px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  textarea { height: 140px; font-size: 12px; font-family: ui-monospace, monospace; }
  .legend { display: flex; flex-direction: column; }
  dialog { max-height: 90vh; overflow: auto; }
  .sheet { padding: 18px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .stat { background: var(--bg); border-radius: 10px; padding: 10px; }
  .stat .k { font-size: 11px; color: var(--muted); }
  .stat .v { font-size: 15px; font-weight: 600; margin-top: 2px; }
  .btn.sm { padding: 11px 6px; font-size: 14px; margin-top: 0; }
  .legend-inline { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 6px; }
</style>
</head>
<body>
<main id="app"></main>
<nav id="tabs"></nav>
<dialog id="dlg"></dialog>

<script>
"use strict";
const KEY = "placements-v1";
const COLORS = { pea: "var(--c-pea)", crypto: "var(--c-crypto)", av: "var(--c-av)", cto: "#378ADD", epargne: "#BA7517" };
const LABELS = { pea: "PEA", crypto: "Crypto", av: "Assurance-vie", cto: "Compte-titres", epargne: "Épargne (livrets)" };
const SCHEMA = {
  pea: [["name", "Nom (ex : ETF Monde)", "text"], ["ticker", "Ticker Yahoo pour le cours auto (ex : CW8.PA)", "text", true],
        ["qty", "Quantité de départ (si tu détiens déjà des parts)", "number", true],
        ["pru", "PRU de départ (€)", "number", true],
        ["since", "Détenu depuis le (pour la position de départ)", "date", true],
        ["price", "Cours manuel (€) si pas de ticker", "number", true],
        ["plan", "Achat mensuel prévu (€), optionnel", "number", true]],
  crypto: [["name", "Nom (ex : Bitcoin)", "text"], ["coin", "Identifiant CoinGecko (ex : bitcoin, ethereum, solana)", "text"],
           ["qty", "Quantité de départ (si tu en détiens déjà)", "number", true], ["pru", "Prix d’achat moyen de départ (€)", "number", true],
           ["since", "Détenu depuis le (pour la position de départ)", "date", true],
           ["plan", "Achat mensuel prévu (€), optionnel", "number", true]],
  av: [["name", "Contrat", "text"], ["invested", "Total versé (€)", "number"], ["value", "Valeur actuelle (€)", "number"]],
  epargne: [["name", "Nom (ex : Livret A)", "text"], ["value", "Montant (€)", "number"]]
};
SCHEMA.cto = SCHEMA.pea;
const n = x => Number(x) || 0;
const eur = x => new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR", minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(x);
const eur2 = x => new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR", maximumFractionDigits: 2 }).format(x);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

let S = load();
let tab = "resume";

function load() {
  try { const r = localStorage.getItem(KEY); if (r) return Object.assign(blank(), JSON.parse(r)); } catch (e) {}
  return blank();
}
function blank() { return { pea: [], cto: [], crypto: [], av: [], epargne: [], hist: [], cash: { pea: { base: 0, since: "", dep: [] }, cto: { base: 0, since: "", dep: [] } }, defaultFee: 0, prev: {}, chg: {}, peaOpen: "", prices: {}, pricesAt: null, offline: false, quotes: {}, quotesAt: null, quotesOffline: false, proxy: "" }; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

function calc(type, it) {
  if (type === "pea" || type === "cto") {
    const live = it.ticker ? S.quotes[it.ticker] : undefined;
    const p = live ?? n(it.price);
    const pos = position(it);
    return { v: pos.qty * p, i: pos.cost, p, live: live != null, pos };
  }
  if (type === "crypto") {
    const p = S.prices[it.coin];
    const pos = position(it);
    return { v: pos.qty * (p ?? 0), i: pos.cost, p, pos };
  }
  if (type === "epargne") return { v: n(it.value), i: n(it.value) };
  return { v: n(it.value), i: n(it.invested) };
}
function totals(type, withCash = true) {
  const a = S[type].reduce((a, it) => { const c = calc(type, it); a.v += c.v; a.i += c.i; return a; }, { v: 0, i: 0 });
  if (withCash && (type === "pea" || type === "cto")) { const c = cashBalance(type); a.v += c; a.i += c; }
  return a;
}
function gainHtml(v, i) {
  if (!i) return `<span class="sub">–</span>`;
  const g = v - i, p = (g / i) * 100, cls = g >= 0 ? "up" : "down", s = g >= 0 ? "+" : "−";
  return `<span class="${cls}">${s}${eur(Math.abs(g))} (${s}${Math.abs(p).toFixed(2).replace(".", ",")} %)</span>`;
}

function render() {
  snapshot();
  document.getElementById("tabs").innerHTML = [["resume", "◎", "Résumé"], ["pea", "▤", "PEA"], ["cto", "▦", "CTO"], ["crypto", "₿", "Crypto"], ["av", "☂", "Assur.-vie"], ["epargne", "€", "Livrets"]]
    .map(([k, ic, l]) => `<button class="${tab === k ? "on" : ""}" data-tab="${k}"><span>${ic}</span>${l}</button>`).join("");
  document.getElementById("app").innerHTML = tab === "resume" ? viewResume() : viewList(tab);
}

function quotesStatus() {
  if (S.quotesOffline) return `<div class="status">Cours PEA indisponibles (relais public parfois saturé) : derniers cours connus ou cours manuel</div>`;
  if (S.quotesAt) return `<div class="status">Cours PEA à ${new Date(S.quotesAt).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })} · décalage d’environ 15 min${S.proxy ? "" : " · relais public"}</div>`;
  return `<div class="status">Chargement des cours PEA…</div>`;
}

function statusLine() {
  if (!S.crypto.length) return "";
  if (S.offline) return `<div class="status">Hors ligne : derniers cours connus${S.pricesAt ? " (" + new Date(S.pricesAt).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }) + ")" : ""}</div>`;
  if (S.pricesAt) return `<div class="status">Crypto en direct · mis à jour à ${new Date(S.pricesAt).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit", second: "2-digit" })}</div>`;
  return `<div class="status">Chargement des cours…</div>`;
}

function viewResume() {
  const T = ["pea", "cto", "crypto", "av", "epargne"].map(k => ({ k, ...totals(k) }));
  const total = T.reduce((a, t) => a + t.v, 0), invested = T.reduce((a, t) => a + t.i, 0);
  let off = 0; const C = 2 * Math.PI * 40;
  const segs = total > 0 ? T.map(t => {
    const len = (t.v / total) * C, el = `<circle cx="60" cy="60" r="40" fill="none" style="stroke:${COLORS[t.k]}" stroke-width="18" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`;
    off += len; return el;
  }).join("") : `<circle cx="60" cy="60" r="40" fill="none" style="stroke:var(--line)" stroke-width="18"/>`;
  return `
    <h1>Patrimoine placé</h1>
    <div class="total">${eur(total)}</div>
    <div class="sub">${gainHtml(total, invested)}</div>${dayHtml()}
    <div class="card pad" style="display:flex;align-items:center;gap:16px">
      <svg viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Répartition entre PEA, crypto et assurance-vie">${segs}</svg>
      <div class="legend" style="flex:1">
        ${T.map(t => `<div style="display:flex;align-items:center;gap:8px;font-size:13px;margin:5px 0"><span class="dot" style="background:${COLORS[t.k]}"></span><span style="flex:1">${LABELS[t.k]}</span><span>${total ? Math.round((t.v / total) * 100) : 0} %</span></div>`).join("")}
      </div>
    </div>
    <div class="card">
      ${T.map(t => `<div class="row" data-tab="${t.k}"><span class="dot" style="background:${COLORS[t.k]}"></span>
        <div class="l"><div class="n">${LABELS[t.k]}</div><div class="d">${S[t.k].length} ligne(s)</div></div>
        <div class="r"><div class="v">${eur(t.v)}</div><div class="g">${t.k === "epargne" ? "" : gainHtml(totals(t.k, false).v, totals(t.k, false).i)}</div></div></div>`).join("")}
    </div>
    ${suiviCard()}${barsCard()}${histCard()}
    ${statusLine()}${(S.pea.length || S.cto.length) ? quotesStatus() : ""}
    <button class="btn ghost" data-act="refresh">Actualiser les cours</button>
    <button class="btn ghost" data-act="settings">Réglages</button>
    <button class="btn ghost" data-act="backup">Sauvegarder / restaurer</button>`;
}

function viewList(type) {
  const t = totals(type), items = S[type];
  const rows = items.map((it, idx) => {
    const c = calc(type, it);
    let d = "";
    if (type === "pea" || type === "cto") d = `${nf(c.pos.qty)} × ${eur2(c.p)} · PRU ${eur2(c.pos.pru)}${it.ticker && !c.live ? " · cours indisponible" : ""}`;
    if (type === "crypto") d = c.p == null ? `${nf(c.pos.qty)} · cours indisponible` : `${nf(c.pos.qty)} × ${eur2(c.p)} · PRU ${eur2(c.pos.pru)}`;
    if (type === "av") d = `Versé ${eur(n(it.invested))}`;
    if (type === "epargne") d = "Épargne disponible";
    return `<div class="row" data-edit="${idx}"><div class="l"><div class="n">${esc(it.name)}</div><div class="d">${esc(d)}</div></div>
      <div class="r"><div class="v">${eur(c.v)}</div><div class="g">${type === "epargne" ? "" : gainHtml(c.v, c.i)}</div></div></div>`;
  }).join("");
  return `
    <h1>${LABELS[type]}</h1>
    <div class="total">${eur(t.v)}</div>
    <div class="sub">${type === "epargne" ? "" : plvHtml(type)}</div>${cashSplit(type)}
    <div class="card">${cashRowHtml(type)}${rows || (cashRowHtml(type) ? "" : `<div class="empty">Aucune ligne pour l’instant.</div>`)}</div>
    ${type === "crypto" ? statusLine() + '<div class="status">Touche une ligne pour ajouter achats, ventes et revenus.</div>' : ""}
    ${type === "pea" ? peaInfo() : ""}${(type === "pea" || type === "cto") ? quotesStatus() + '<div class="status">Touche une ligne pour ajouter achats, ventes, dividendes et frais.</div>' : ""}
    <button class="btn" data-add="${type}">+ Ajouter</button>`;
}

function openForm(type, idx) {
  const it = idx == null ? {} : S[type][idx];
  const dlg = document.getElementById("dlg");
  dlg.innerHTML = `<form id="f"><h2>${idx == null ? "Ajouter" : "Modifier"} · ${LABELS[type]}</h2>
    ${SCHEMA[type].map(([k, l, t, opt]) => `<label>${l}<input name="${k}" type="${t}" ${t === "number" ? 'step="any" inputmode="decimal"' : 'autocomplete="off"'} value="${esc(it[k] ?? "")}" ${opt ? "" : "required"}></label>`).join("")}
    <button class="btn" type="submit">Enregistrer</button>
    ${idx != null ? `<button class="btn danger" type="button" id="del">Supprimer</button>` : ""}
    <button class="btn ghost" type="button" id="cancel">Annuler</button></form>`;
  showDlg(dlg);
  dlg.querySelector("#cancel").onclick = () => dlg.close();
  const del = dlg.querySelector("#del");
  if (del) del.onclick = () => { S[type].splice(idx, 1); save(); dlg.close(); render(); };
  dlg.querySelector("#f").onsubmit = e => {
    e.preventDefault();
    const o = {};
    for (const [k, , t] of SCHEMA[type]) {
      let v = e.target.elements[k].value.trim();
      if (t === "number") v = Number(v.replace(",", "."));
      if (k === "coin") v = v.toLowerCase();
      if (k === "ticker") v = v.toUpperCase();
      o[k] = v;
    }
    if (idx == null) S[type].push(o); else S[type][idx] = Object.assign({}, S[type][idx], o);
    save(); dlg.close(); render();
    if (type === "crypto") refreshPrices();
    if (type === "pea" || type === "cto") refreshQuotes();
  };
}

function openBackup() {
  const dlg = document.getElementById("dlg");
  const data = JSON.stringify({ pea: S.pea, cto: S.cto, crypto: S.crypto, av: S.av, epargne: S.epargne, hist: S.hist, cash: S.cash });
  dlg.innerHTML = `<form><h2>Sauvegarde</h2>
    <label>Copie ce texte et garde-le dans tes notes. Pour restaurer, colle-le ici puis valide.<textarea id="bk">${esc(data)}</textarea></label>
    <button class="btn" type="button" id="copy">Copier</button>
    <button class="btn ghost" type="button" id="restore">Restaurer depuis ce texte</button>
    <button class="btn ghost" type="button" id="close">Fermer</button></form>`;
  showDlg(dlg);
  const ta = dlg.querySelector("#bk");
  dlg.querySelector("#close").onclick = () => dlg.close();
  dlg.querySelector("#copy").onclick = async () => {
    try { await navigator.clipboard.writeText(ta.value); } catch (e) { ta.select(); document.execCommand("copy"); }
  };
  dlg.querySelector("#restore").onclick = () => {
    try {
      const j = JSON.parse(ta.value);
      if (!Array.isArray(j.pea) || !Array.isArray(j.crypto) || !Array.isArray(j.av)) throw 0;
      S.pea = j.pea; S.crypto = j.crypto; S.av = j.av; S.cto = j.cto || []; S.epargne = j.epargne || []; S.hist = j.hist || []; if (j.cash) S.cash = j.cash; save(); dlg.close(); render(); refreshPrices();
    } catch (e) { alert("Texte invalide : sauvegarde non restaurée."); }
  };
}

async function refreshPrices() {
  const ids = [...new Set(S.crypto.map(c => String(c.coin || "").trim().toLowerCase()).filter(Boolean))];
  if (!ids.length) return;
  try {
    const r = await fetch("https://api.coingecko.com/api/v3/simple/price?vs_currencies=eur&include_24hr_change=true&ids=" + encodeURIComponent(ids.join(",")));
    if (!r.ok) throw new Error("http " + r.status);
    const j = await r.json();
    for (const id of ids) if (j[id] && j[id].eur != null) { S.prices[id] = j[id].eur; if (j[id].eur_24h_change != null) S.chg[id] = j[id].eur_24h_change; }
    S.pricesAt = Date.now(); S.offline = false;
  } catch (e) { S.offline = true; }
  save(); render();
}

async function fetchYahoo(sym) {
  const y = "https://query1.finance.yahoo.com/v8/finance/chart/" + encodeURIComponent(sym) + "?interval=1m&range=1d";
  const tries = [
    u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
    u => "https://corsproxy.io/?url=" + encodeURIComponent(u)
  ];
  for (const t of tries) {
    try {
      const r = await fetch(t(y));
      if (!r.ok) continue;
      const m = (await r.json()).chart.result[0].meta;
      if (m.regularMarketPrice != null) return { price: m.regularMarketPrice, prev: m.chartPreviousClose ?? m.previousClose ?? null };
    } catch (e) {}
  }
  return null;
}

async function refreshQuotes() {
  const syms = [...new Set(S.pea.concat(S.cto).map(p => String(p.ticker || "").trim().toUpperCase()).filter(Boolean))];
  if (!syms.length) return;
  let got = 0;
  try {
    if (S.proxy) {
      const r = await fetch(S.proxy.replace(/\/+$/, "") + "/?s=" + encodeURIComponent(syms.join(",")));
      if (!r.ok) throw new Error("http " + r.status);
      const j = await r.json();
      for (const sym of syms) if (j[sym] && j[sym].price != null) { S.quotes[sym] = j[sym].price; if (j[sym].prev != null) S.prev[sym] = j[sym].prev; got++; }
    } else {
      const res = await Promise.all(syms.map(fetchYahoo));
      syms.forEach((sym, i) => { if (res[i] != null) { S.quotes[sym] = res[i].price; if (res[i].prev != null) S.prev[sym] = res[i].prev; got++; } });
    }
  } catch (e) {}
  if (got) { S.quotesAt = Date.now(); S.quotesOffline = false; } else { S.quotesOffline = true; }
  save(); render();
}

const nf = x => new Intl.NumberFormat("fr-FR", { maximumFractionDigits: 6 }).format(x);
const signed = x => (x >= 0 ? "+" : "−") + eur2(Math.abs(x));
const today = () => new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
function showDlg(d) { if (!d.open) d.showModal(); }

// PRU automatique : coût moyen pondéré, frais d'achat inclus
function position(it) {
  let qty = n(it.qty), cost = n(it.qty) * n(it.pru), fees = 0, div = 0, realized = 0;
  const mv = (it.moves || []).slice().sort((a, b) => (a.date || "").localeCompare(b.date || ""));
  for (const m of mv) {
    if (m.type === "buy") { cost += n(m.qty) * n(m.price) + n(m.fees); qty += n(m.qty); fees += n(m.fees); }
    else if (m.type === "sell") {
      const avg = qty > 0 ? cost / qty : 0, q = Math.min(n(m.qty), qty);
      realized += n(m.qty) * n(m.price) - n(m.fees) - avg * q;
      cost -= avg * q; qty -= q; fees += n(m.fees);
    } else if (m.type === "div") div += n(m.amount);
  }
  return { qty, cost, pru: qty > 0 ? cost / qty : 0, fees, div, realized };
}
function stockItems() { return [...S.pea.map(it => ["pea", it]), ...S.cto.map(it => ["cto", it]), ...S.crypto.map(it => ["crypto", it])]; }

function ready() {
  return S.crypto.every(c => S.prices[c.coin] != null) && stockItems().every(([, p]) => !p.ticker || S.quotes[p.ticker] != null);
}
function snapshot() {
  if (!ready()) return;
  const row = { d: today(), v: 0, i: 0 };
  for (const k of ["pea", "cto", "crypto", "av", "epargne"]) { const t = totals(k); row.v += t.v; row.i += t.i; }
  if (row.v <= 0) return;
  row.v = Math.round(row.v * 100) / 100; row.i = Math.round(row.i * 100) / 100;
  S.hist = S.hist || [];
  const last = S.hist[S.hist.length - 1];
  if (last && last.d === row.d) { if (last.v === row.v && last.i === row.i) return; S.hist[S.hist.length - 1] = row; }
  else S.hist.push(row);
  S.hist = S.hist.slice(-800);
  save();
}

const signedPct = x => (x >= 0 ? "+" : "−") + Math.abs(x * 100).toFixed(2).replace(".", ",") + " %";

// TRI (taux de rendement interne) : performance annualisée selon les dates des flux
function xirr(flows) {
  if (flows.length < 2 || !flows.some(f => f.a < 0) || !flows.some(f => f.a > 0)) return null;
  const t0 = Math.min(...flows.map(f => f.t)), Y = 31557600000;
  const f = r => flows.reduce((s, x) => s + x.a / Math.pow(1 + r, (x.t - t0) / Y), 0);
  let lo = -0.99, hi = 10, flo = f(lo);
  if (flo * f(hi) > 0) return null;
  for (let k = 0; k < 200; k++) { const mid = (lo + hi) / 2, fm = f(mid); if (flo * fm <= 0) hi = mid; else { lo = mid; flo = fm; } }
  return (lo + hi) / 2;
}
function ledgerFlows(type, it) {
  const c = calc(type, it), fl = [];
  if (c.v <= 0) return null;
  if (n(it.qty) > 0) { if (!it.since) return null; fl.push({ t: new Date(it.since + "T12:00:00").getTime(), a: -n(it.qty) * n(it.pru) }); }
  for (const m of it.moves || []) {
    const t = new Date((m.date || today()) + "T12:00:00").getTime();
    if (m.type === "buy") fl.push({ t, a: -(n(m.qty) * n(m.price) + n(m.fees)) });
    else if (m.type === "sell") fl.push({ t, a: n(m.qty) * n(m.price) - n(m.fees) });
    else if (m.type === "div") fl.push({ t, a: n(m.amount) });
  }
  if (!fl.some(f => f.a < 0)) return null;
  fl.push({ t: Date.now(), a: c.v });
  return fl;
}
function tri(flows) {
  if (!flows) return null;
  if (Date.now() - Math.min(...flows.map(f => f.t)) < 60 * 864e5) return null;
  return xirr(flows);
}
function globalTri() {
  const all = []; let excluded = 0;
  for (const [t, it] of stockItems()) {
    const f = ledgerFlows(t, it);
    if (f) all.push(...f); else if (n(it.qty) > 0 || (it.moves || []).length) excluded++;
  }
  return { rate: tri(all.length ? all : null), excluded };
}

function lineDay(type, it) {
  const c = calc(type, it);
  if (type === "crypto") {
    const ch = S.chg[it.coin];
    if (ch == null || !c.v) return null;
    const pv = c.v / (1 + ch / 100); return { d: c.v - pv, base: pv };
  }
  if (it.ticker && S.quotes[it.ticker] != null && S.prev[it.ticker] != null) {
    const pv = c.pos.qty * S.prev[it.ticker]; return { d: c.v - pv, base: pv };
  }
  return null;
}
function dayChange() {
  let d = 0, base = 0, any = false;
  for (const [t, it] of stockItems()) { const x = lineDay(t, it); if (x) { d += x.d; base += x.base; any = true; } }
  return any ? { d, pct: base ? d / base : 0 } : null;
}
function dayHtml() {
  const x = dayChange();
  if (!x) return "";
  return `<div class="sub">Aujourd’hui : <span class="${x.d >= 0 ? "up" : "down"}">${signed(x.d)} (${signedPct(x.pct)})</span></div>`;
}
function periodsHtml(h) {
  const l = h[h.length - 1];
  const line = (label, days) => {
    const cut = new Date(new Date(l.d + "T12:00:00").getTime() - days * 864e5).toISOString().slice(0, 10);
    let r = null; for (const x of h) if (x.d <= cut) r = x;
    if (!r) return "";
    const g = (l.v - r.v) - (l.i - r.i);
    return `<div class="sub">${label} : <span class="${g >= 0 ? "up" : "down"}">${signed(g)}${r.v ? " (" + signedPct(g / r.v) + ")" : ""}</span></div>`;
  };
  return line("7 jours, hors versements", 7) + line("30 jours, hors versements", 30);
}
function peaInfo() {
  if (!S.peaOpen) return "";
  const o = new Date(S.peaOpen + "T12:00:00"), five = new Date(o.getFullYear() + 5, o.getMonth(), o.getDate(), 12);
  const days = Math.ceil((five - Date.now()) / 864e5);
  const f = five.toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" });
  return `<div class="status">${days > 0 ? `PEA : seuil des 5 ans le ${f} (dans ${days} jours)` : `PEA : seuil des 5 ans atteint depuis le ${f}`}</div>`;
}

// Espèces : solde de départ + versements/retraits + effet automatique des achats, ventes et dividendes
function cashBalance(type) {
  const c = S.cash && S.cash[type];
  if (!c || !c.since) return 0; // tant que le solde n’est pas réglé, les espèces ne comptent pas
  const since = c.since;
  let b = n(c.base);
  for (const d of c.dep || []) if ((d.date || "") > since) b += n(d.a);
  for (const it of S[type]) for (const m of it.moves || []) {
    if ((m.date || "") <= since) continue;
    if (m.type === "buy") b -= n(m.qty) * n(m.price) + n(m.fees);
    else if (m.type === "sell") b += n(m.qty) * n(m.price) - n(m.fees);
    else if (m.type === "div") b += n(m.amount);
  }
  return b;
}
function plvHtml(type) {
  const t = totals(type, false);
  return `Plus-value latente : ${gainHtml(t.v, t.i)}`;
}
function cashSplit(type) {
  if (type !== "pea" && type !== "cto") return "";
  return `<div class="sub">Titres ${eur(totals(type, false).v)} · Espèces ${eur(cashBalance(type))}</div>`;
}
function cashRowHtml(type) {
  if (type !== "pea" && type !== "cto") return "";
  return `<div class="row" data-cash="${type}"><div class="l"><div class="n">Espèces</div><div class="d">${S.cash[type].since ? "Solde disponible sur le " + (type === "pea" ? "PEA" : "compte-titres") : "Touche pour régler ton solde d’espèces"}</div></div><div class="r"><div class="v">${eur(cashBalance(type))}</div></div></div>`;
}

function suiviCard() {
  let fees = 0, div = 0, real = 0, div12 = 0, val = 0;
  const cut = new Date(Date.now() - 365 * 864e5).toISOString().slice(0, 10);
  for (const [t, it] of stockItems()) {
    const p = position(it); fees += p.fees; div += p.div; real += p.realized;
    if (t !== "crypto") { val += calc(t, it).v; for (const m of it.moves || []) if (m.type === "div" && (m.date || "") >= cut) div12 += n(m.amount); }
  }
  const g = globalTri();
  if (!fees && !div && !real && g.rate == null) return "";

}

function barsCard() {
  const months = [], d = new Date();
  for (let k = 11; k >= 0; k--) { const x = new Date(d.getFullYear(), d.getMonth() - k, 1); months.push(x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0")); }
  const sums = Object.fromEntries(months.map(m => [m, 0]));
  let any = false, total = 0;
  for (const [, it] of stockItems()) for (const m of it.moves || []) if (m.type === "buy") {
    const k = (m.date || "").slice(0, 7), a = n(m.qty) * n(m.price) + n(m.fees);
    if (k in sums) { sums[k] += a; total += a; any = true; }
  }
  if (!any) return "";
  const max = Math.max(...Object.values(sums), 1);
  const bars = months.map((m, k) => {
    const h = (sums[m] / max) * 70;
    return `<rect x="${k * 26 + 4}" y="${80 - h}" width="18" height="${h}" rx="3" style="fill:var(--accent)"><title>${m} : ${eur(sums[m])}</title></rect><text x="${k * 26 + 13}" y="94" font-size="8" text-anchor="middle" style="fill:var(--muted)">${m.slice(5)}</text>`;
  }).join("");
  return `<div class="card pad"><div class="n" style="font-weight:500">Investi par mois</div>
    <svg viewBox="0 0 320 100" width="100%" role="img" aria-label="Montants investis chaque mois sur douze mois">${bars}</svg>
    <div class="sub">Total sur 12 mois : ${eur(total)}</div></div>`;
}

  const W = 320, H = 110, pad = 6;

  const line = key => h.map((r, k) => `${X(k).toFixed(1)},${Y(r[key]).toFixed(1)}`).join(" ");
  const f = h[0], l = h[h.length - 1], fd = x => new Date(x + "T12:00:00").toLocaleDateString("fr-FR", { day: "2-digit", month: "short" });

  showDlg(dlg);
  dlg.querySelector("#close").onclick = () => dlg.close();
  dlg.querySelector("form").onsubmit = e => {
    e.preventDefault();
    S.proxy = dlg.querySelector("#px").value.trim(); S.defaultFee = Number(dlg.querySelector("#fee").value) || 0; S.peaOpen = dlg.querySelector("#pea").value; save(); dlg.close(); render(); refreshQuotes();
  };
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-tab],[data-edit],[data-add],[data-act],[data-cash]");
  if (!t) return;
  if (t.dataset.tab) { tab = t.dataset.tab; render(); window.scrollTo(0, 0); }
  else if (t.dataset.cash) openCash(t.dataset.cash);
  else if (t.dataset.edit != null) { (tab === "pea" || tab === "cto" || tab === "crypto") ? openDetail(tab, Number(t.dataset.edit)) : openForm(tab, Number(t.dataset.edit)); }
  else if (t.dataset.add) openForm(t.dataset.add, null);
  else if (t.dataset.act === "refresh") { refreshPrices(); refreshQuotes(); }
  else if (t.dataset.act === "settings") openSettings();
  else if (t.dataset.act === "backup") openBackup();
});
setInterval(() => { if (!document.hidden) { refreshPrices(); refreshQuotes(); } }, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) { refreshPrices(); refreshQuotes(); } });

render();
refreshPrices();
refreshQuotes();
</script>
</body>
</html>
